name: Mirror to GitLab

on:
  push:
    branches: ['*']
    tags: ['*']
  delete:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Push mirror to GitLab
        env:
          GITLAB_USER: ${{ secrets.GITLAB_USERNAME }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git remote add gitlab https://${GITLAB_USER}:${GITLAB_TOKEN}@gitlab.com/filipswiszcz/magsim.git
          git push --force --prune gitlab "refs/remotes/origin/*:refs/heads/*"
          git push --force --prune gitlab "refs/tags/*:refs/tags/*"
