name: Mirror to GitLab

on:
  push:
    branches: ['*']
    tags: ['*']
  delete:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push mirror to GitLab
        env:
          GITLAB_USER: ${{secrets.GITLAB_USERNAME}}
          GITLAB_TOKEN: ${{secrets.GITLAB_TOKEN}}
        run:
          git push --mirror https://${GITLAB_USER}:${GITLAB_TOKEN}@gitlab.com/{GITLAB_USER}/magsim.git